name: Framework Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Frameworks/**'
      - 'scripts/node-*/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/frameworks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Frameworks/**'
      - 'scripts/node-*/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/frameworks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frameworks-${{ github.ref }}
  cancel-in-progress: true

env:
  XDEBUG_MODE: 'off'
  TZ: UTC

jobs:
  upstream:
    name: PHP ${{ matrix.php }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        suite: [express, hono-main, hono-jsx-runtime-default, hono-jsx-runtime-dom, hono-node, http2]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, curl, intl, openssl, sodium, zlib, sockets
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: tests/Frameworks/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --prefix tests/Frameworks

      - name: Prepare Express source
        if: matrix.suite == 'express'
        run: python3 -B tests/Frameworks/express/setup.py

      - name: Prepare Hono source
        if: startsWith(matrix.suite, 'hono-')
        run: python3 -B tests/Frameworks/hono/setup.py

      - name: Express original tests
        if: matrix.suite == 'express'
        run: |
          python3 -B tests/Frameworks/express/test_runner.py
          python3 -B tests/Frameworks/express/run.py --runtime both --jobs 1 --output framework-results/express

      - name: Hono harness deadline differential
        if: startsWith(matrix.suite, 'hono-')
        run: |
          python3 -B tests/Frameworks/hono/test_runner.py
          python3 -B tests/Frameworks/hono/selftest.py

      - name: Hono original runtime tests
        if: startsWith(matrix.suite, 'hono-')
        env:
          FRAMEWORK_SUITE: ${{ matrix.suite }}
        run: python3 -B tests/Frameworks/hono/run.py --project "${FRAMEWORK_SUITE#hono-}" --timeout 1800

      - name: Hono independent native Vitest baseline
        if: startsWith(matrix.suite, 'hono-') && !cancelled()
        env:
          FRAMEWORK_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p framework-results
          if [ "$FRAMEWORK_SUITE" = 'hono-main' ]; then
            node tests/Frameworks/hono/prepare-toolchain.mjs
          fi
          PHASIS_HONO_PROJECT="${FRAMEWORK_SUITE#hono-}" node tests/Frameworks/node_modules/vitest/vitest.mjs run \
            --config tests/Frameworks/hono/vitest.config.mjs \
            --reporter=json --outputFile="$PWD/framework-results/hono-native.json"

      - name: Compare every Hono case with native Vitest
        if: startsWith(matrix.suite, 'hono-') && !cancelled()
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          results = Path('tests/Frameworks/hono/results')
          run_id = json.loads((results / 'manifest.json').read_text())['id']
          manifest = results / 'runs' / run_id / 'manifest.json'
          statuses = [subprocess.run([
              'python3', '-B', 'tests/Frameworks/hono/compare-native.py',
              'framework-results/hono-native.json', str(manifest), '--runtime', runtime,
          ]).returncode for runtime in ['node', 'phasis']]
          raise SystemExit(int(any(statuses)))
          PY

      - name: Hono original declaration tests
        if: matrix.suite == 'hono-main' && !cancelled()
        run: python3 -B tests/Frameworks/hono/run-toolchain.py

      - name: HTTP2 native Node interoperability
        if: matrix.suite == 'http2'
        run: |
          mkdir -p framework-results
          node tests/Frameworks/http2/interop.mjs | tee framework-results/http2.jsonl

      - name: Preserve complete manifests and failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frameworks-php${{ matrix.php }}-${{ matrix.suite }}-${{ github.sha }}
          path: |
            framework-results/
            tests/Frameworks/hono/results/runs/
          if-no-files-found: warn
