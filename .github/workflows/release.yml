name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, intl
          tools: composer

      - name: Stage the canonical runtime archive
        run: |
          mkdir -p dist/phasis
          git archive HEAD | tar -x -C dist/phasis
          composer install --working-dir=dist/phasis --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify autoloader
        run: |
          cd dist/phasis
          php -r "require 'vendor/autoload.php'; class_exists('Phasis\\Engine', true) || exit(1); echo 'Autoloader OK';"
          php bin/phasis -e 'console.log(1 + 1)' | grep -q '^2$'

      - name: Create release archive
        run: |
          cd dist && zip -r ../phasis.zip phasis/

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" phasis.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
