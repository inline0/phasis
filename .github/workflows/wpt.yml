name: Web Platform Tests

# Runs the Web Platform Tests subset Phasis ships under
# tests/Wpt/fixtures/. This is the WHATWG / W3C analogue of the
# compat-matrix workflow that runs test262 (TC39). Currently scoped
# to: url/, encoding/, atob, structured-clone, hr-time.
#
# Each push / PR runs the suite. Failures block the merge.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Wpt/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/wpt.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Wpt/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/wpt.yml'
  workflow_dispatch:

concurrency:
  group: wpt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Many imported fixtures load helpers via `// META: script=…`
      # directives whose paths resolve into tests/Wpt/upstream/ — a
      # local sparse-checkout of web-platform-tests/wpt. Re-create it
      # in CI so the helpers resolve. Pin the commit so the suite is
      # reproducible; bump alongside fixture imports.
      - name: Populate WPT upstream sparse-checkout
        env:
          WPT_COMMIT: 6fb724af7b721f91aeef4ce237ba90112408fd68
        run: |
          mkdir -p tests/Wpt/upstream
          cd tests/Wpt/upstream
          git init -q
          git remote add origin https://github.com/web-platform-tests/wpt.git
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /fetch/
          /streams/
          /FileAPI/
          /xhr/
          /dom/abort/
          /dom/events/
          /resources/testharness.js
          /resources/testharnessreport.js
          /common/
          /WebCryptoAPI/
          /websockets/
          /console/
          /compression/
          /html/webappapis/timers/
          /html/webappapis/microtask-queuing/
          /urlpattern/
          EOF
          git fetch --depth 1 origin "$WPT_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      # PHPUnit honours the EXPECTED_FAILURES allowlist in
      # tests/Wpt/WptTest.php (currently just
      # streams/async-iterator.any.js, deferred until Phasis gains
      # event-loop semantics). Run it first so the workflow's terminal
      # status reflects whether anything regressed beyond the
      # documented gap.
      - name: Run WPT PHPUnit testsuite
        run: php -d memory_limit=2G vendor/bin/phpunit --testsuite wpt

      # bin/wpt is the honest CLI — it does NOT apply the allowlist and
      # exits non-zero if any subtest fails. Kept as an informational
      # step so the per-fixture pass/fail breakdown still lands in the
      # workflow logs. continue-on-error keeps the workflow green when
      # the failure is one of the allowlisted deferrals; any new
      # regression is still caught by the PHPUnit step above.
      - name: Run WPT runner (CLI, informational)
        continue-on-error: true
        run: php -d memory_limit=2G bin/wpt
