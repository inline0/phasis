name: Remix Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Remix/**'
      - 'tests/Popular/RemixCompatibilityTest.php'
      - 'bin/test-remix'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.github/workflows/remix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/Remix/**'
      - 'tests/Popular/RemixCompatibilityTest.php'
      - 'bin/test-remix'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.github/workflows/remix.yml'
  workflow_dispatch:

concurrency:
  group: remix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/Remix/package-lock.json
      - name: Install pinned Remix without lifecycle scripts
        working-directory: tests/Remix
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original-package Node oracles
        working-directory: tests/Remix
        env:
          TZ: UTC
        run: npm run oracle:check
      - name: Check existing passing probes and record all gaps
        run: php bin/test-remix --json --check-baseline > tests/Remix/report.json
      - name: Publish compatibility summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('tests/Remix/report.json')
          if not path.exists() or not path.stat().st_size:
              raise SystemExit('No Remix compatibility report was produced')
          report = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Remix ' + report['package']['version'] + '\n\n')
              summary.write(' | '.join(str(value) + ' ' + key for key, value in report['counts'].items()) + '\n\n')
              summary.write(report['coverageNote'] + '\n\n')
              summary.write('The regression gate preserves known passing probes. Known failures are still reported as failures.\n\n')
              for result in report['results']:
                  if result['status'] != 'pass':
                      summary.write('- ' + result['status'] + ': `' + result['id'] + '`\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remix-compatibility
          path: tests/Remix/report.json
          if-no-files-found: error
