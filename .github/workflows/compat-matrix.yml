name: Compatibility Report (Matrix)

# Shards test262 across multiple runners so the full compat pass finishes in
# minutes instead of hours. Each shard runs ./bin/compat-report --match <prefix>
# producing per-shard state; the merge job combines them into one
# compat.json + COMPAT.md.
#
# IMPORTANT: the union of shard prefixes MUST cover every test262 top-level
# category and the shards MUST NOT overlap. compat-report --match is a
# startswith match on the group name (e.g. "built-ins/Array"); --exclude
# (also startswith) carves overlapping subgroups out.

on:
  workflow_dispatch:

concurrency:
  group: compat-matrix
  cancel-in-progress: false

permissions:
  contents: write

# All first-party JS actions used below (checkout v6, upload-artifact
# v6, download-artifact v6) declare runs.using: node24 natively, so
# no runtime forcing flag is needed.

jobs:
  shard:
    runs-on: ubuntu-latest
    # 45 minutes is enough for every shard we have today; the longest
    # single shard under the cap is ~30 min. If a shard hits the wall,
    # GH kills it and the merge job still runs.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard:
          # Catch-all top-level sections (small).
          - { id: 'annexB', prefix: 'annexB', exclude: '' }
          - { id: 'harness', prefix: 'harness', exclude: '' }
          - { id: 'intl402', prefix: 'intl402', exclude: '' }
          - { id: 'staging', prefix: 'staging', exclude: '' }
          # built-ins split by first letter so shards never overlap.
          # Top-level built-ins start with: A B D E F G I J M N O P R S T U W
          # plus lowercase: d e g i p u (which start lowercase top-levels like
          # "decodeURIComponent", "encodeURI", "eval", "globalThis",
          # "isFinite", "isNaN", "parseFloat", "parseInt", "undefined").
          - { id: 'builtins-A', prefix: 'built-ins/A', exclude: '' }
          - { id: 'builtins-Array', prefix: 'built-ins/Array', exclude: '' }
          - { id: 'builtins-B', prefix: 'built-ins/B', exclude: '' }
          - { id: 'builtins-D', prefix: 'built-ins/D', exclude: '' }
          - { id: 'builtins-E', prefix: 'built-ins/E', exclude: '' }
          - { id: 'builtins-F', prefix: 'built-ins/F', exclude: '' }
          - { id: 'builtins-G', prefix: 'built-ins/G', exclude: '' }
          - { id: 'builtins-I', prefix: 'built-ins/I', exclude: '' }
          - { id: 'builtins-J', prefix: 'built-ins/J', exclude: '' }
          - { id: 'builtins-M', prefix: 'built-ins/M', exclude: '' }
          - { id: 'builtins-N', prefix: 'built-ins/N', exclude: '' }
          - { id: 'builtins-O', prefix: 'built-ins/O', exclude: '' }
          - { id: 'builtins-P', prefix: 'built-ins/P', exclude: '' }
          - { id: 'builtins-Reflect', prefix: 'built-ins/Reflect', exclude: '' }
          # RegExp has 1867 tests with several PCRE-hanging patterns.
          # Split into three shards so any one shard fits well under the
          # 45-min cap. compat-report groups RegExp at depth 3 so these
          # subprefixes resolve to distinct groups.
          - { id: 'builtins-RegExp-prototype', prefix: 'built-ins/RegExp/prototype', exclude: '' }
          # property-escapes/generated holds 432 procedurally generated
          # unicode property tests, each ~6-8s through the custom regex
          # matcher's ICU dispatch. Split into 5 parallel runner shards
          # via the --files-prefix / --files-exclude-prefix flags. The
          # original Script_-_ shard (170 tests) was tipping over the
          # 45-min cap with CI runner variance (43m one run, 45m the
          # next), so it's split alphabetically A-L / M-Z. The
          # --files-prefix flag accepts multiple values (matches ANY
          # of them) so a single shard can carve out a letter range.
          #   Script_-_A through Script_-_L     (~81 tests)
          #   Script_-_M through Script_-_Z     (~89 tests)
          #   Script_Extensions_-_              (~170 tests)
          #   General_Category_-_               (~38 tests)
          #   rest (Binary, Bidi, Emoji, etc.)  (~54 tests)
          - { id: 'builtins-RegExp-property-escapes-script-al', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: 'Script_-_A Script_-_B Script_-_C Script_-_D Script_-_E Script_-_F Script_-_G Script_-_H Script_-_I Script_-_J Script_-_K Script_-_L', filesExcludePrefix: '' }
          - { id: 'builtins-RegExp-property-escapes-script-mz', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: 'Script_-_M Script_-_N Script_-_O Script_-_P Script_-_Q Script_-_R Script_-_S Script_-_T Script_-_U Script_-_V Script_-_W Script_-_X Script_-_Y Script_-_Z', filesExcludePrefix: '' }
          # Script_Extensions_-_ has the same 170-test load as Script_-_
          # and similarly tips over the 45-min cap with the bundled
          # Unicode 16 tables in the hot path (~1.1M codepoints per
          # negative-test sweep through PHP-level binary search). Split
          # A-L / M-Z by the same logic as Script_-_.
          - { id: 'builtins-RegExp-property-escapes-scriptext-al', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: 'Script_Extensions_-_A Script_Extensions_-_B Script_Extensions_-_C Script_Extensions_-_D Script_Extensions_-_E Script_Extensions_-_F Script_Extensions_-_G Script_Extensions_-_H Script_Extensions_-_I Script_Extensions_-_J Script_Extensions_-_K Script_Extensions_-_L', filesExcludePrefix: '' }
          - { id: 'builtins-RegExp-property-escapes-scriptext-mz', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: 'Script_Extensions_-_M Script_Extensions_-_N Script_Extensions_-_O Script_Extensions_-_P Script_Extensions_-_Q Script_Extensions_-_R Script_Extensions_-_S Script_Extensions_-_T Script_Extensions_-_U Script_Extensions_-_V Script_Extensions_-_W Script_Extensions_-_X Script_Extensions_-_Y Script_Extensions_-_Z', filesExcludePrefix: '' }
          - { id: 'builtins-RegExp-property-escapes-gc', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: 'General_Category_-_', filesExcludePrefix: '' }
          - { id: 'builtins-RegExp-property-escapes-rest', prefix: 'built-ins/RegExp/property-escapes', exclude: '', filesPrefix: '', filesExcludePrefix: 'Script_-_ Script_Extensions_-_ General_Category_-_' }
          - { id: 'builtins-RegExp-rest', prefix: 'built-ins/RegExp', exclude: 'built-ins/RegExp/prototype built-ins/RegExp/property-escapes' }
          - { id: 'builtins-S', prefix: 'built-ins/S', exclude: '' }
          # Temporal has 4165 tests; split by top-level type.
          - { id: 'builtins-Temporal-Duration', prefix: 'built-ins/Temporal/Duration', exclude: '' }
          - { id: 'builtins-Temporal-Instant', prefix: 'built-ins/Temporal/Instant', exclude: '' }
          - { id: 'builtins-Temporal-PlainDate', prefix: 'built-ins/Temporal/PlainDate', exclude: 'built-ins/Temporal/PlainDateTime' }
          - { id: 'builtins-Temporal-PlainDateTime', prefix: 'built-ins/Temporal/PlainDateTime', exclude: '' }
          - { id: 'builtins-Temporal-PlainTime', prefix: 'built-ins/Temporal/PlainTime', exclude: '' }
          - { id: 'builtins-Temporal-PlainYearMonth', prefix: 'built-ins/Temporal/PlainYearMonth', exclude: '' }
          - { id: 'builtins-Temporal-PlainMonthDay', prefix: 'built-ins/Temporal/PlainMonthDay', exclude: '' }
          - { id: 'builtins-Temporal-ZonedDateTime', prefix: 'built-ins/Temporal/ZonedDateTime', exclude: '' }
          - { id: 'builtins-Temporal-rest', prefix: 'built-ins/Temporal', exclude: 'built-ins/Temporal/Duration built-ins/Temporal/Instant built-ins/Temporal/PlainDate built-ins/Temporal/PlainTime built-ins/Temporal/PlainYearMonth built-ins/Temporal/PlainMonthDay built-ins/Temporal/ZonedDateTime' }
          - { id: 'builtins-TypedArray', prefix: 'built-ins/TypedArray', exclude: '' }
          - { id: 'builtins-ThrowTypeError', prefix: 'built-ins/ThrowTypeError', exclude: '' }
          - { id: 'builtins-U', prefix: 'built-ins/U', exclude: '' }
          - { id: 'builtins-W', prefix: 'built-ins/W', exclude: '' }
          # Lowercase top-level built-ins.
          - { id: 'builtins-lower-de', prefix: 'built-ins/d', exclude: '' }
          - { id: 'builtins-lower-en', prefix: 'built-ins/e', exclude: '' }
          - { id: 'builtins-lower-g', prefix: 'built-ins/g', exclude: '' }
          - { id: 'builtins-lower-is', prefix: 'built-ins/i', exclude: '' }
          - { id: 'builtins-lower-parse', prefix: 'built-ins/p', exclude: '' }
          - { id: 'builtins-lower-undef', prefix: 'built-ins/u', exclude: '' }
          # language/ is also split.
          - { id: 'language-expressions', prefix: 'language/expressions', exclude: '' }
          - { id: 'language-statements', prefix: 'language/statements', exclude: '' }
          - { id: 'language-module-code', prefix: 'language/module-code', exclude: '' }
          - { id: 'language-eval-code', prefix: 'language/eval-code', exclude: '' }
          - { id: 'language-literals', prefix: 'language/literals', exclude: '' }
          - { id: 'language-arguments', prefix: 'language/arguments-object', exclude: '' }
          - { id: 'language-asi', prefix: 'language/asi', exclude: '' }
          - { id: 'language-block-scope', prefix: 'language/block-scope', exclude: '' }
          - { id: 'language-comments', prefix: 'language/comments', exclude: '' }
          - { id: 'language-computed', prefix: 'language/computed-property-names', exclude: '' }
          - { id: 'language-destructuring', prefix: 'language/destructuring', exclude: '' }
          - { id: 'language-directive', prefix: 'language/directive-prologue', exclude: '' }
          - { id: 'language-export-import', prefix: 'language/export', exclude: '' }
          - { id: 'language-import', prefix: 'language/import', exclude: '' }
          - { id: 'language-function-code', prefix: 'language/function-code', exclude: '' }
          - { id: 'language-future-reserved', prefix: 'language/future-reserved-words', exclude: '' }
          - { id: 'language-global-code', prefix: 'language/global-code', exclude: '' }
          - { id: 'language-identifier', prefix: 'language/identifier', exclude: '' }
          - { id: 'language-keywords', prefix: 'language/keywords', exclude: '' }
          - { id: 'language-line-terminators', prefix: 'language/line-terminators', exclude: '' }
          - { id: 'language-punctuators', prefix: 'language/punctuators', exclude: '' }
          - { id: 'language-reserved-words', prefix: 'language/reserved-words', exclude: '' }
          - { id: 'language-rest-parameters', prefix: 'language/rest-parameters', exclude: '' }
          - { id: 'language-source-text', prefix: 'language/source-text', exclude: '' }
          - { id: 'language-statements-list', prefix: 'language/statementList', exclude: '' }
          - { id: 'language-types', prefix: 'language/types', exclude: '' }
          - { id: 'language-white-space', prefix: 'language/white-space', exclude: '' }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl
          coverage: none
          ini-values: memory_limit=2G

      # Cache Composer dependencies across shards so 73 parallel jobs
      # don't all hammer Packagist; flaky mirror hits otherwise turn
      # entire shards into failures (run 25770149237 lost 3 shards
      # this way even with a 3-retry loop).
      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        # Wrap composer install in a 3-attempt retry: occasional
        # mirror flakes on GH runners have caused entire runs to fail
        # at this step (run 25758154888 / 25759842734). Hard-exits if
        # all attempts fail or if vendor/autoload.php is missing
        # afterward — a silent failure here turns every chunk into a
        # crash and every test into a phantom-block in the merge
        # output (run 25768949070 exposed this gap).
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      - name: Check test262 submodule
        run: |
          echo "test262 directory:"
          ls -la test262 | head -5
          echo "Harness files:"
          ls test262/harness 2>&1 | head -5
          echo "Test dir:"
          ls test262/test 2>&1 | head -5

      - name: Run compat shard
        run: |
          set -x
          mkdir -p .compat-state-${{ matrix.shard.id }}
          # Build --exclude args from the whitespace-separated list in the
          # matrix entry. Tight per-chunk timeout bounds how much a hanging
          # test can steal from the shard budget.
          EXCLUDE_ARGS=""
          for ex in ${{ matrix.shard.exclude }}; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $ex"
          done
          # property-escapes/generated has 432 \p{...} tests that each
          # take ~6-8s. The matrix splits the group across multiple shards
          # via --files-prefix / --files-exclude-prefix; pump jobs up and
          # chunks down so any single chunk completes well under the
          # per-chunk timeout.
          JOBS=4
          CHUNK=25
          # Per-chunk wall budget. 90s covers every JS-tree-walker test
          # we care about at CI's ~3x interpreter slowdown vs local.
          # Shards that contain tests promoted to single-file chunks via
          # test262_isolated_tests (config/support.php) get a wider
          # budget — those tests were isolated precisely because they
          # approach or exceed the default budget locally, and CI's
          # slower interpreter pushes them past it. Tests that need
          # multi-minute CI budgets even with isolation still belong
          # in HOST_GAP_BLOCKLIST (tests/Oracle/Test262Runner.php).
          TIMEOUT=90
          case '${{ matrix.shard.id }}' in
            builtins-RegExp-property-escapes-*)
              JOBS=8
              CHUNK=5
              TIMEOUT=60
              ;;
            staging|builtins-lower-de)
              # staging/sm/Date/dst-offset-caching-{1..8} runs an O(n^4)
              # DST cache probe; locally 33-42s on M4, ~3x on CI puts
              # the slowest shards over 120s. built-ins/lower-de hosts
              # decodeURI/decodeURIComponent A2.5_T1 sweeps (~983K
              # four-byte percent-encoded sequences). Both shards run
              # most chunks fast; only the isolated stress files need
              # the extended budget.
              TIMEOUT=240
              ;;
          esac
          # Build --files-prefix / --files-exclude-prefix from optional
          # matrix fields. Both are whitespace-separated so one shard can
          # carve out multiple prefixes (e.g. "rest" shard, A-L / M-Z
          # alphabetical splits).
          FILES_PREFIX_ARGS=""
          for fp in ${{ matrix.shard.filesPrefix }}; do
            FILES_PREFIX_ARGS="$FILES_PREFIX_ARGS --files-prefix $fp"
          done
          FILES_EXCLUDE_ARGS=""
          for fx in ${{ matrix.shard.filesExcludePrefix }}; do
            FILES_EXCLUDE_ARGS="$FILES_EXCLUDE_ARGS --files-exclude-prefix $fx"
          done
          ./bin/compat-report \
            --match '${{ matrix.shard.prefix }}' \
            $EXCLUDE_ARGS \
            $FILES_PREFIX_ARGS \
            $FILES_EXCLUDE_ARGS \
            --state-dir .compat-state-${{ matrix.shard.id }} \
            --jobs $JOBS \
            --timeout $TIMEOUT \
            --chunk-size $CHUNK
          echo "=== After compat-report ==="
          ls -la .compat-state-${{ matrix.shard.id }}
          echo "=== State subtree ==="
          find .compat-state-${{ matrix.shard.id }} -type f | head -20

      - name: Upload shard state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-shard-${{ matrix.shard.id }}
          path: .compat-state-${{ matrix.shard.id }}
          if-no-files-found: warn
          include-hidden-files: true

  merge:
    needs: shard
    # Run even when a shard fails (typically RegExp timing out) so we
    # still produce a compat snapshot from whatever succeeded.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so rebase-onto-main succeeds even when main
          # has advanced since the workflow started.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl
          coverage: none
          ini-values: memory_limit=2G

      # Cache Composer dependencies across shards so 73 parallel jobs
      # don't all hammer Packagist; flaky mirror hits otherwise turn
      # entire shards into failures (run 25770149237 lost 3 shards
      # this way even with a 3-retry loop).
      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        # Wrap composer install in a 3-attempt retry: occasional
        # mirror flakes on GH runners have caused entire runs to fail
        # at this step (run 25758154888 / 25759842734). Hard-exits if
        # all attempts fail or if vendor/autoload.php is missing
        # afterward — a silent failure here turns every chunk into a
        # crash and every test into a phantom-block in the merge
        # output (run 25768949070 exposed this gap).
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      - name: Download all shard artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: compat-shard-*
          path: .compat-shards

      - name: Merge shard states into unified compat snapshot
        run: php bin/compat-merge-shards .compat-shards

      - name: Show summary
        if: always()
        run: |
          if [ -f COMPAT.md ]; then
            echo "## Compatibility Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -30 COMPAT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload merged artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-report
          path: |
            COMPAT.md
            compat.json

      - name: Commit COMPAT.md
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add COMPAT.md compat.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update COMPAT.md from CI [skip ci]"
          # The workflow can run for an hour+; rebase onto whatever main
          # has moved to so the push does not fail on a conflict with
          # unrelated commits. If rebase fails we bail gracefully; the
          # artifact upload still carries the snapshot for manual commit.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "Rebase conflict; snapshot is in the compat-report artifact."
            exit 0
          fi
          if ! git push origin HEAD:main; then
            echo "Push failed; snapshot is in the compat-report artifact."
            exit 0
          fi
