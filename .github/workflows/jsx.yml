name: JSX Pack

# Runs the JSX Pack suites: the committed oracle outputs (parse, lowering,
# resolution, package smoke, React render, three-way, HTML, precompile,
# Goals examples) through PHPUnit, then the hydration check, which needs
# Node at test time: React 19.3's client hydrates the HTML Phasis renders
# for every React fixture in jsdom, production and development builds.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'browser/**'
      - 'tests/Jsx/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/jsx.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'browser/**'
      - 'tests/Jsx/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/jsx.yml'
  workflow_dispatch:

concurrency:
  group: jsx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsx:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, curl
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/Jsx/oracle/package-lock.json

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile

      - name: Install the pinned oracle toolchain
        working-directory: tests/Jsx/oracle
        run: npm ci --no-audit --no-fund

      # The package smoke and Goals tests load packages from the pinned
      # toolchain's node_modules, so install it first.
      - name: Run JSX suites
        run: php -d memory_limit=1G vendor/bin/phpunit --testsuite jsx

      - name: Hydrate every React fixture
        env:
          TZ: UTC
        run: node tests/Jsx/oracle/hydrate.ts

      - name: Qualify the Composer hydration consumer
        run: node tests/Jsx/oracle/hydration-contract.ts

  hydration-runtime:
    name: Hydration runtime PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl, curl
          coverage: none

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/Jsx/oracle/package-lock.json

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile

      - name: Install the pinned browser toolchain
        working-directory: tests/Jsx/oracle
        run: npm ci --no-audit --no-fund

      # Only the downstream runtime is installed. PHPUnit requires newer PHP
      # than our supported library minimum and is not a runtime dependency.
      - name: Qualify the Composer hydration consumer
        run: node tests/Jsx/oracle/hydration-contract.ts
