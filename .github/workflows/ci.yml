name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # composer.json declares ^8.2 for the runtime, but PHPUnit 13.1
        # (the canonical _cp profile) requires PHP 8.4.1+, so the dev
        # tooling matrix starts at 8.4.
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.5-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      - name: PHPStan
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --memory-limit=2G

      - name: PHPCS
        run: vendor/bin/phpcs -n

      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite=unit

      - name: Oracle regression
        run: ./bin/test-regression --fast
