name: Benchmark

# Manual-only, mirrors the compat workflows. Bench results are noisy and
# burn CI minutes — running on every push would mostly produce churn. Run
# this after a perf change, then commit the refreshed BENCH.md.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Iterations per test (median is reported)'
        required: false
        default: '5'

# Allow the job to push the regenerated BENCH.md / bench.json back.
permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, opcache
          coverage: none
          # Tracing JIT with a generous code-cache buffer. Our hot dispatch
          # loop is exactly the shape OPcache JIT specialises well: tight
          # `switch` over int opcodes, frequent same-shape array indexing.
          ini-values: memory_limit=2G, opcache.enable=1, opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed; sleeping 10s..."
            sleep 10
          done
          if [ ! -f vendor/autoload.php ]; then
            echo "vendor/autoload.php missing after 3 install attempts; failing"
            exit 1
          fi

      - name: Run benchmark
        run: ./bin/bench-report --runs ${{ github.event.inputs.runs || '5' }}

      - name: Show summary
        if: always()
        run: |
          if [ -f BENCH.md ]; then
            echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat BENCH.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-report
          path: |
            BENCH.md
            bench.json

      - name: Commit BENCH.md
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BENCH.md bench.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update BENCH.md from CI [skip ci]"
            git push
          fi
